aid: zenlytic
name: Zenlytic
description: >-
  Zenlytic is an AI-powered business intelligence platform built around Zoë, an
  autonomous AI data analyst that turns natural-language questions into verified,
  governed insights and business-ready artifacts (dashboards, decks, models, and
  reports). It connects to cloud warehouses (Snowflake, BigQuery, Redshift,
  Databricks, Azure Synapse), builds a semantic context layer from schemas and
  query history, and answers with full lineage so every result is traceable to its
  source tables, filters, and metrics. Developers integrate Zenlytic through its
  open-source metrics-layer Python library, an iframe embedding surface with a
  signed-URL REST endpoint for external users, SSO (Microsoft Entra, Okta), and
  experimental MCP connectors that let Zoë call tools in the surrounding data stack.
  Zenlytic is backed by Bain Capital Ventures.
